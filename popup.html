<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AquiReminder</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup-body">
    <header class="header">
      <img src="drop.png" alt="" />
      <h1 data-i18n="extName">AquiReminder</h1>
    </header>
    <main>
      <div id="setReminder">
        <p class="section-label" data-i18n="howOften">
          How often should we remind you?
        </p>
        <div class="preset-row">
          <button
            class="chip"
            type="button"
            data-minutes="15"
            aria-pressed="false"
          >
            15 min
          </button>
          <button
            class="chip"
            type="button"
            data-minutes="30"
            aria-pressed="false"
          >
            30 min
          </button>
          <button
            class="chip"
            type="button"
            data-minutes="60"
            aria-pressed="false"
          >
            60 min
          </button>
        </div>
        <div class="input-row">
          <label for="id_Sec" data-i18n="custom">Custom</label>
          <input
            type="number"
            id="id_Sec"
            min="1"
            max="480"
            data-i18n-placeholder="minutesPlaceholder"
            placeholder="Minutes"
            aria-describedby="rangeHint error"
          />
        </div>
        <p class="range-hint" id="rangeHint"></p>
        <button class="btn btn-primary" id="id_Set" type="button" disabled>
          <span data-i18n="startReminders">Start reminders</span>
        </button>
        <p class="error" id="error" role="alert" aria-live="assertive"></p>
      </div>
      <div id="remainingTime" class="hidden">
        <div id="countdownSection" class="countdown-section">
          <p class="section-label" data-i18n="nextReminderIn">
            Next reminder in
          </p>
          <div class="countdown-ring">
            <div class="countdown-ring-inner">
              <span class="countdown-time" id="time" aria-live="polite">0:00</span>
            </div>
          </div>
          <p class="interval-label" id="intervalInfo"></p>
          <p class="next-at" id="nextAt"></p>
        </div>
        <div id="dueSection" class="due-section hidden">
          <p class="due-title" data-i18n="timeToHydrate">Time to hydrate!</p>
          <p class="due-hint" id="dueHint" data-i18n="dueHint">
            Your reminder is waiting
          </p>
          <button class="btn btn-primary" id="id_Ack" type="button">
            <span data-i18n="drankWater">I drank water!</span>
          </button>
          <div class="due-actions">
            <button class="btn btn-secondary" id="id_Reopen" type="button">
              <span data-i18n="showReminder">Show reminder</span>
            </button>
            <button class="btn btn-secondary" id="id_Snooze" type="button">
              <span data-i18n="snooze5">Snooze 5 min</span>
            </button>
          </div>
        </div>
        <button class="btn btn-secondary" id="id_Clear" type="button">
          <span data-i18n="stopReminders">Stop reminders</span>
        </button>
      </div>
    </main>
    <footer class="language-footer">
      <label for="languageSelect" data-i18n="language">Language</label>
      <select id="languageSelect"></select>
    </footer>
    <script src="i18n.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
