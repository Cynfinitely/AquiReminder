# PR gates: conventional PR title, no AI attribution, valid locales, no secrets.
# Hooks can be skipped with --no-verify; these cannot.
name: PR checks

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title-and-attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: sh scripts/lint-pr-title.sh
      # docs/agent-rules/no-ai-attribution.md
      - name: No AI attribution in PR title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | node scripts/check-ai-attribution.mjs --stdin --label "PR title/body"
      - name: No AI attribution in PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-ai-attribution.mjs --git-range "$BASE_SHA..$HEAD_SHA"

  quality:
    # Title/body edits don't change code; skip for them.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci --prefer-offline --no-audit --no-fund
      - run: npm run check:locales
      - run: npm run test:ai-attribution
      - run: npm run test:commitlint

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
